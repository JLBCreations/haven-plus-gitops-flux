apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
spec:
  interval: 30m
  driftDetection:
    mode: disabled
  install:
    strategy: 
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy: 
      name: RetryOnFailure
      retryInterval: 2m
  chart:
    spec:
      chart: velero
      version: 12.2.1
      sourceRef:
        kind: HelmRepository
        name: velero
      interval: 12h
  values:
    extraVolumes:
    - emptyDir: {}
      name: udmrepo
    - emptyDir: {}
      name: cache
    extraVolumeMounts:
    - mountPath: /udmrepo
      name: udmrepo
    - mountPath: /.cache
      name: cache
    upgradeCRDs: true
    metrics:
      serviceMonitor:
        enabled: false
    credentials:
      useSecret: true
      name: "cloud-credentials"
      secretContents: {} # set in overlay
    deployNodeAgent: true
    nodeAgent:
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
    snapshotsEnabled: false
    defaultBackupStorageLocation: "aws"
    uploaderType: "kopia"
    defaultVolumesToFsBackup: true
    containerSecurityContext: 
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1001
      seccompProfile:
        type: RuntimeDefault
    # The chart uses the kubectl image only for the cleanUpCRDs and namespace.labels hooks,
    # which are disabled. These hooks run /bin/kubectl, so keep the chart default image
    # (alpine/k8s has kubectl in /usr/bin).
    kubectl:
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
