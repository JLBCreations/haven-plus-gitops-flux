apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
spec:
  releaseName: trivy-operator
  interval: 30m
  driftDetection:
    mode: enabled
  install:
    strategy: 
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy: 
      name: RetryOnFailure
      retryInterval: 2m
  chart:
    spec:
      chart: trivy-operator
      version: "0.28.1" # see https://artifacthub.io/packages/helm/trivy-operator/trivy-operator
      sourceRef:
        kind: HelmRepository
        name: trivy-operator
  values:
    serviceMonitor:
      enabled: true
    securityContext:
      seccompProfile:
        type: RuntimeDefault
      runAsNonRoot: true
    trivyOperator:
      scanJobPodTemplateContainerSecurityContext:
        seccompProfile:
          type: RuntimeDefault
