apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
spec:
  releaseName: trivy-operator
  interval: 30m
  driftDetection:
    mode: enabled
  install:
    strategy: 
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy: 
      name: RetryOnFailure
      retryInterval: 2m
  chart:
    spec:
      chart: trivy-operator
      version: "0.28.1" # see https://artifacthub.io/packages/helm/trivy-operator/trivy-operator
      sourceRef:
        kind: HelmRepository
        name: trivy-operator
  values:
    serviceMonitor:
      enabled: true
    securityContext:
      seccompProfile:
        type: RuntimeDefault
      runAsNonRoot: true
    trivyOperator:
      scanJobPodTemplateContainerSecurityContext:
        seccompProfile:
          type: RuntimeDefault
    trivy:
      # Scan jobs ran out of memory at the chart default limit of 500M (OOMKilled).
      resources:
        limits:
          memory: 1Gi
      # Report only vulnerabilities that have a fix. The falco-driver-loader image
      # alone has about 4200 vulnerabilities; the VulnerabilityReport of the Falco
      # DaemonSet exceeded the etcd object limit (1.5 MiB) and could never be stored.
      ignoreUnfixed: true
