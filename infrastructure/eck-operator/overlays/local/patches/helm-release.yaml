apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: eck-operator
spec:
  values:
    # The base runs two operators (one active, one standby); on a single-node local cluster one is enough.
    replicaCount: 1
    resources:
      # set resource requests so that eck-operator can run on local Kind envs
      requests:
        cpu: 1m
        memory: 1Mi
