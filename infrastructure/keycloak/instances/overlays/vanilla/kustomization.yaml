apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak-instances
resources:
  - ../../base
#  - sealed.yaml
patches:
  - target:
      kind: Keycloak
      name: keycloak
    patch: |
      - op: replace
        path: /spec/hostname/hostname
        value: keycloak.${domain}
  - target:
      kind: HTTPRoute
      name: keycloak
    patch: |
      - op: replace
        path: /spec/hostnames/0
        value: keycloak.${domain}
  - target:
      kind: KeycloakRealmImport
      name: havenplus-realm-import
    patch: |
      - op: replace
        path: /spec/realm/clients/1/redirectUris/0
        value: "https://grafana.${domain}/login/generic_oauth"
  - target:
      kind: KeycloakRealmImport
      name: havenplus-realm-import
    patch: |
      - op: replace
        path: /spec/realm/clients/2/redirectUris/0
        value: "https://opencost.${domain}/oauth2/callback"
