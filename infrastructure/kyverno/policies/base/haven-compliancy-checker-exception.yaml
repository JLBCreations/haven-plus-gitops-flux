# The Haven Compliancy Checker (`haven check`) creates a temporary namespace
# haven-check-<unix time>. It runs these workloads in that namespace and
# deletes the namespace when it is done:
# - a privileged busybox pod with hostPID and hostPath /sys and /proc, to read
#   the node configuration
# - kube-bench and kubescape Jobs with hostPID and read-only hostPath mounts
# - an nginx Deployment with a PVC, to test storage
# The checker labels the namespace pod-security enforce=privileged. This
# exception lets the same workloads past the Kyverno policies. It lists only
# the policies that these workloads fail.
# Only a cluster admin can create a namespace, so only a cluster admin can use
# this exception.
# See https://haven.commonground.nl/techniek/compliancy-checker
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: haven-compliancy-checker
spec:
  exceptions:
    - policyName: disallow-capabilities-strict
      ruleNames:
        - require-drop-all
        - autogen-require-drop-all
        - autogen-cronjob-require-drop-all
    - policyName: disallow-host-namespaces
      ruleNames:
        - host-namespaces
        - autogen-host-namespaces
        - autogen-cronjob-host-namespaces
    - policyName: disallow-host-path
      ruleNames:
        - host-path
        - autogen-host-path
        - autogen-cronjob-host-path
    - policyName: disallow-privilege-escalation
      ruleNames:
        - privilege-escalation
        - autogen-privilege-escalation
        - autogen-cronjob-privilege-escalation
    - policyName: disallow-privileged-containers
      ruleNames:
        - privileged-containers
        - autogen-privileged-containers
        - autogen-cronjob-privileged-containers
    - policyName: require-run-as-nonroot
      ruleNames:
        - run-as-non-root
        - autogen-run-as-non-root
        - autogen-cronjob-run-as-non-root
    - policyName: restrict-seccomp-strict
      ruleNames:
        - check-seccomp-strict
        - autogen-check-seccomp-strict
        - autogen-cronjob-check-seccomp-strict
    - policyName: restrict-volume-types
      ruleNames:
        - restricted-volumes
        - autogen-restricted-volumes
        - autogen-cronjob-restricted-volumes
  match:
    any:
      - resources:
          kinds:
            - Pod
            - Deployment
            - ReplicaSet
            - Job
          namespaces:
            - haven-check-*
