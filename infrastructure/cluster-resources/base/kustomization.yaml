# Either refer directly to a URL, or add the CRDs in this repo. 
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: set-in-overlay
resources:
  - ./network-policies
  - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.5.1/standard-install.yaml
  - https://download.elastic.co/downloads/eck/3.5.0/crds.yaml
  # Prometheus-Operator CRDs
  - https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/v0.81.0/example/prometheus-operator-crd/monitoring.coreos.com_podmonitors.yaml
  - https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/v0.81.0/example/prometheus-operator-crd/monitoring.coreos.com_servicemonitors.yaml
  - https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/v0.81.0/example/prometheus-operator-crd/monitoring.coreos.com_prometheusrules.yaml

# Upstream CRDs can contain ${...} in their descriptions, for example the ECK
# StackConfigPolicy. Flux postBuild must not touch them: it fails on names such
# as ${foo.bar}, and in strict mode on any unknown ${VAR}. A CRD never needs a
# value from cluster-vars.
patches:
  - target:
      kind: CustomResourceDefinition
    patch: |
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: any
        annotations:
          kustomize.toolkit.fluxcd.io/substitute: disabled
