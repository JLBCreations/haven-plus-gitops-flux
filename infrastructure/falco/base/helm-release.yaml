apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: falco
spec:
  releaseName: falco
  interval: 30m
  driftDetection:
    mode: enabled
  install:
    strategy: 
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy: 
      name: RetryOnFailure
      retryInterval: 2m
  chart:
    spec:
      chart: falco
      version: "9.2.0" # see https://artifacthub.io/packages/helm/falcosecurity/falco
      sourceRef:
        kind: HelmRepository
        name: falco
  values:
    # With falcosidekick enabled, the chart sets json_output and points http_output at
    # falcosidekick itself.
    falcosidekick:
      enabled: true
      config:
        customfields: "from:falcosidekick"
        loki:
          hostport: "http://loki-gateway.loki.svc.cluster.local:80"
          endpoint: "/loki/api/v1/push" 
          tenant: "admin"
    metrics:
      enabled: true
    serviceMonitor:
      create: true
    collectors:
      kubernetes:
        enabled: true
